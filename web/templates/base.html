<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}crypto-signal-agent{% endblock %}</title>
<script src="/static/htmx.min.js"></script>
<style>
  body {
    font-family: -apple-system, Segoe UI, Arial, sans-serif;
    margin: 0;
    padding: 0 1.5rem 3rem;
    background: #0f1115;
    color: #d8dbe2;
    font-size: 14px;
  }
  h1 { font-size: 1.3rem; margin: 1.5rem 0 0.25rem; }
  h2 { font-size: 1.05rem; margin: 2rem 0 0.5rem; color: #9aa4b8; }
  p.hint { color: #7c8397; margin: 0 0 1rem; }
  table {
    border-collapse: collapse;
    width: 100%;
    background: #171a21;
  }
  th, td {
    border-bottom: 1px solid #262b36;
    padding: 6px 10px;
    text-align: left;
    vertical-align: top;
    white-space: nowrap;
  }
  td.wrap, th.wrap { white-space: normal; }
  th {
    background: #1d212b;
    color: #9aa4b8;
    font-weight: 600;
    position: sticky;
    top: 0;
  }
  tr:hover td { background: #1b1f29; }
  .badge {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 0.75rem;
    margin-right: 4px;
  }
  .badge-open { background: #2f4f2f; color: #a6e3a1; }
  .badge-closed { background: #3a3f4c; color: #b6bcc9; }
  .badge-old-formula { background: #5a3a1a; color: #ffcf8a; }
  .actions button {
    margin-right: 4px;
    padding: 4px 8px;
    border: 1px solid #3a3f4c;
    background: #232733;
    color: #d8dbe2;
    border-radius: 4px;
    cursor: pointer;
  }
  .actions button:hover { background: #2b3040; }
  .actions input[type=text] {
    width: 140px;
    background: #12141a;
    border: 1px solid #3a3f4c;
    color: #d8dbe2;
    border-radius: 4px;
    padding: 3px 6px;
    margin-right: 4px;
  }
  .error-msg { color: #ff8a8a; font-weight: 600; }
  .prior { color: #9aa4b8; font-size: 0.85rem; }
  .empty { color: #7c8397; padding: 1rem 0; }
  form.filter-form { margin: 0.5rem 0 1rem; }
  form.filter-form label { color: #9aa4b8; }
</style>
</head>
<body>
{% block content %}{% endblock %}
<script>
  // Allow a 400 response body (validation error from POST /episodes/outcome)
  // to still swap into the page instead of htmx silently discarding it -
  // htmx only swaps 2xx responses by default. Successful (2xx) labels keep
  // the default behaviour and remove the row as usual.
  document.body.addEventListener('htmx:beforeSwap', function (evt) {
    if (evt.detail.xhr.status === 400) {
      evt.detail.shouldSwap = true;
      evt.detail.isError = false;
    }
  });
</script>
</body>
</html>
