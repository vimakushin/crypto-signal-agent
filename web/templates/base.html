<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}crypto-signal-agent{% endblock %}</title>
<script src="/static/htmx.min.js"></script>
<style>
  body {
    font-family: -apple-system, Segoe UI, Arial, sans-serif;
    padding: 0 1.5rem 3rem;
    max-width: 1400px;
    margin: 0 auto;
    background: #0f1115;
    color: #d8dbe2;
    font-size: 14px;
  }
  h1 { font-size: 1.3rem; margin: 1.5rem 0 0.25rem; }
  h2 { font-size: 1.05rem; margin: 2rem 0 0.5rem; color: #9aa4b8; }
  p.hint { color: #7c8397; margin: 0 0 1rem; }
  .card { background: #171a21; border: 1px solid #262b36; border-radius: 6px; padding: 10px 14px; margin-bottom: 12px; }
  .card-head { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
  .coin { font-size: 1.05rem; }
  .sig { color: #9aa4b8; }
  .desc { margin-top: 0.5rem; overflow-wrap: anywhere; }
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px 14px; margin-top: 0.6rem; }
  .metrics .market { grid-column: 1 / -1; }
  .metrics .k { display: block; color: #7c8397; font-size: 0.75rem; }
  .actions { margin-top: 0.7rem; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .badge {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 3px;
    font-size: 0.75rem;
    margin-right: 4px;
  }
  .badge-open { background: #2f4f2f; color: #a6e3a1; }
  .badge-closed { background: #3a3f4c; color: #b6bcc9; }
  .badge-old-formula { background: #5a3a1a; color: #ffcf8a; }
  .actions button {
    padding: 6px 10px;
    border: 1px solid #3a3f4c;
    background: #232733;
    color: #d8dbe2;
    border-radius: 4px;
    cursor: pointer;
  }
  .actions button:hover { background: #2b3040; }
  .actions input[type=text] {
    width: 220px;
    max-width: 100%;
    background: #12141a;
    border: 1px solid #3a3f4c;
    color: #d8dbe2;
    border-radius: 4px;
    padding: 3px 6px;
  }
  .error-msg { color: #ff8a8a; font-weight: 600; }
  .prior { margin-top: 0.6rem; color: #9aa4b8; font-size: 0.85rem; }
  .marks { margin-top: 0.5rem; overflow-wrap: anywhere; padding: 4px 8px; border-left: 3px solid #e0b050; background: #2a2418; color: #f0e2bd; }
  .note { margin-top: 0.5rem; padding: 4px 8px; border-left: 3px solid #5a6a8a; background: #1a1d26; white-space: pre-line; font-size: 0.85rem; }
  .note-label { color: #7c8397; font-size: 0.7rem; text-transform: uppercase; }
  .notes-error { color: #ff8a8a; font-weight: 600; border: 1px solid #ff8a8a; padding: 6px 10px; }
  .empty { color: #7c8397; padding: 1rem 0; }
  form.filter-form { margin: 0.5rem 0 1rem; }
  form.filter-form label { color: #9aa4b8; }
  @media (max-width: 600px) {
    body { padding: 0 16px 2rem; }
    .actions input[type=text] { width: 100%; }
  }
</style>
</head>
<body>
{% block content %}{% endblock %}
<script>
  // Allow a 400 response body (validation error from POST /episodes/outcome)
  // to still swap into the page instead of htmx silently discarding it -
  // htmx only swaps 2xx responses by default. Successful (2xx) labels keep
  // the default behaviour and remove the row as usual.
  document.body.addEventListener('htmx:beforeSwap', function (evt) {
    if (evt.detail.xhr.status === 400) {
      evt.detail.shouldSwap = true;
      evt.detail.isError = false;
    }
  });
</script>
</body>
</html>
