# Config for Crypto Early Signal Detector (see TZ_crypto_early_signal_detector.md)
# Watchlist and signal thresholds live here, not hardcoded in Python (TZ section 6.4).

watchlist:
  # DeFiLlama protocol slugs. 25 real protocols with both revenue/fees data
  # and a directly resolvable token market cap (verified against the live API).
  # Multi-version protocols like "uniswap-v3" or "aave-v3" are NOT usable yet:
  # DeFiLlama reports their token's market cap only under a separate parent
  # entity that the free API does not expose in a joinable form. Documented
  # as a known MVP limitation - see collectors/defillama.py.
  defillama_protocols:
    - aave-v2
    - jupiter-aggregator
    - lido
    - convex-finance
    - ens
    - olympus-dao
    - axie-infinity
    - thorchain-dex
    - railgun
    - nexus-mutual
    - cowswap
    - safe
    - livepeer
    - sushiswap
    - ssv-network
    - ankr
    - osmosis-dex
    - renzo
    - illuvium
    - hyperlane
    - virtuals-protocol
    - reserve-protocol
    - api3
    - frankencoin
    - ston.fi

  # Binance Futures USDT-M perpetual tickers for the OI/price divergence
  # signal (TZ section 4.1). Coinglass was the source named in the original
  # TZ, but Coinglass no longer has a free API tier at all (cheapest paid
  # plan is $29/mo) - replaced with Binance Futures public endpoints, which
  # need no API key. See collectors/binance_futures.py for the endpoints
  # used. Verified live against GET /fapi/v1/exchangeInfo on 2026-09-09:
  # all 26 symbols below are active TRADING perpetuals. EOSUSDT was in the
  # original 27-symbol list but turned out to be delisted from Binance
  # Futures entirely (not just renamed) - removed after the live check
  # caught it. MATICUSDT and FTMUSDT were deliberately left out too - both
  # projects rebranded their token in 2024, and a Futures ticker around a
  # rebrand is exactly the kind of thing that needs a live check, which is
  # why EOSUSDT's delisting was worth catching here rather than assuming.
  binance_futures_symbols:
    - BTCUSDT
    - ETHUSDT
    - BNBUSDT
    - SOLUSDT
    - XRPUSDT
    - ADAUSDT
    - DOGEUSDT
    - AVAXUSDT
    - LINKUSDT
    - DOTUSDT
    - LTCUSDT
    - TRXUSDT
    - ATOMUSDT
    - NEARUSDT
    - ETCUSDT
    - BCHUSDT
    - UNIUSDT
    - AAVEUSDT
    - FILUSDT
    - ALGOUSDT
    - XLMUSDT
    - VETUSDT
    - ICPUSDT
    - HBARUSDT
    - SANDUSDT
    - APTUSDT

signals:
  revenue_price_gap:
    # TZ section 4.5: revenue/fees grew by >= X% over `lookback_days`,
    # while market cap grew less than that (or fell).
    enabled: true
    weight: 1.0
    # Recent window: median daily revenue over this many days is compared
    # against the median over baseline_window_days below. Any positive value
    # less than baseline_window_days works - signals/revenue_price_gap.py no
    # longer requires exactly 7 or 30 the way its original DeFiLlama-sum-
    # based version did (that constraint existed only because DeFiLlama's
    # own pre-computed rollups came in just those two flavors; this version
    # computes its own medians from stored daily revenue instead).
    lookback_days: 7
    # Baseline window the recent window's median is compared against -
    # a quarter (90 days) is long enough that one unusual week (a seasonal
    # spike, a one-off incentive campaign) doesn't get mistaken for the
    # protocol's new normal, but short enough that a protocol that has
    # genuinely changed its business model within that time isn't still
    # being judged against a business it no longer runs.
    baseline_window_days: 90
    revenue_growth_threshold_pct: 30
    mcap_reaction_threshold_pct: 10
    # Outlier guard (see BACKLOG.md's "revenue_price_gap ловит одиночные
    # выбросы" entry - thorchain-dex's 12 Sep 2026 false positive, where one
    # day supplied 60% of the week's total revenue): if a single day
    # contributes more than this share of the recent window's total, that
    # week is rejected as a one-day spike, not a trend, regardless of what
    # the median comparison below says. 50% - literally "more than half of
    # the week came from one day" - is a plain, self-evidently unusual
    # threshold, not backfit to any specific protocol's history.
    outlier_max_share_pct: 50
    # Business-scale floor, NOT exchange/market liquidity (unlike
    # oi_divergence's min_oi_value_usdt or volume_breakout's
    # min_volume_avg_usd, which do measure real trading liquidity) - this is
    # TZ section 9's "too small to trust" noise risk applied to the
    # protocol's own REVENUE size instead. Checked against the recent
    # window's revenue SUM and the baseline window's median scaled to a
    # weekly-equivalent (signals/revenue_price_gap.py's scan_watchlist()
    # checks both sides, since a tiny value on EITHER side inflates the
    # growth ratio). $10,000/week is deliberately low, not a forgotten
    # setting. Now that revenue_growth_pct itself is computed from MEDIANS
    # (not sums), this floor's only remaining job is to rule out protocols
    # whose daily revenue is so small that the numbers are source-data
    # rounding and noise rather than a real business fact - guarding against
    # a single-day spike and against "tiny base, huge percent swing" is now
    # handled separately, by outlier_max_share_pct above and by the median
    # itself. This was raised to $50,000 on 2026-09-15 and then reverted:
    # at $50,000 it cut 61 of 127 episodes (nearly half) and switched off
    # seven protocols (including aave-v2, ens, axie-infinity, olympus-dao,
    # ssv-network, thorchain-dex, ston.fi) that together account for 39% of
    # all signal activity - and a manual check of four of those seven
    # against their raw daily numbers showed a broad multi-day trend, not
    # noise. The genuinely toy-scale case is ankr at $27/week, not
    # aave-v2. Full numbers are in BACKLOG.md. $10,000 is a return to the
    # earlier-justified value based on this new evidence, not a number
    # picked to maximize how many signals fire.
    min_revenue_total_usd: 10000

  oi_divergence:
    # TZ section 4.1: Open Interest grew by >= X% over `lookback_hours`,
    # while price moved by less than Y% over the same window - stays high
    # while nobody has "shown up" on the price chart yet. Stated range in
    # the TZ is 24-48h; 36h is the midpoint, splitting the difference
    # between reacting fast and needing enough OI history to be stable.
    enabled: true
    weight: 1.0
    lookback_hours: 36
    oi_growth_threshold_pct: 30
    price_change_threshold_pct: 5
    # Liquidity/noise floor (TZ section 9): minimum Open Interest in USD
    # (binance_oi_snapshots.oi_value_usdt - collectors/binance_futures.py)
    # the latest stored point must have before a symbol is even evaluated.
    # $5,000,000 is the order of magnitude below which a Futures market
    # cannot be said to have real institutional positioning behind it - a
    # handful of retail orders can move a market that thin by 30%+ in a day,
    # which would look identical to genuine accumulation under this signal's
    # OI-growth condition. Starting value, not calibrated against outcomes
    # yet - subject to the same future threshold calibration as everything
    # else in this file (see BACKLOG.md's backtest entry), not derived from
    # how many signals it happens to leave on the current history.
    min_oi_value_usdt: 5000000

  volume_breakout:
    # TZ section 4.7: price breaks above a multi-month resistance level
    # (the highest daily price over the past `resistance_lookback_days`
    # days, EXCLUDING today) on volume at least `volume_ratio_threshold`
    # times the average daily volume over the past `volume_avg_lookback_days`
    # days (also excluding today, so today's own possibly-extreme volume
    # never inflates the baseline it's being compared against - see
    # signals/volume_breakout.py). Source: collectors/coingecko.py's daily
    # market_chart history, stored in storage/db.py's
    # coingecko_price_history table.
    enabled: true
    weight: 1.0
    # "Multi-month" per the TZ - 180 days (~6 months) is a level that has
    # survived roughly two quarters of trading, long enough that breaking it
    # is a real structural event rather than noise from a recent local high.
    # CoinGecko's free market_chart endpoint caps daily-granularity history
    # at 365 days (collectors/coingecko.py's MAX_SAFE_DAYS) - 180 leaves
    # comfortable room within that budget for the 30-day volume window plus
    # data gaps, while still being long enough to call "multi-month".
    resistance_lookback_days: 180
    # TZ section 4.7 states this exact window: "volume ... above the average
    # over the last 30 days" - not a range to pick from, unlike the other
    # two settings here.
    volume_avg_lookback_days: 30
    # TZ section 4.7 gives a 2-3x range; 2.5x (the midpoint) is the starting
    # value - clearly above normal day-to-day volume noise without setting
    # the bar as high as 3x, which would let a confirmed breakout on merely
    # "strong" (not extreme) volume slip through unreported. Same
    # calibrate-later spirit as oi_divergence's 30%/5% starting values.
    volume_ratio_threshold: 2.5
    # Liquidity/noise floor (TZ section 9): minimum trailing average daily
    # volume in USD (the same `volume_avg` this signal already computes over
    # volume_avg_lookback_days) a protocol must clear before it's even
    # evaluated. $1,000,000/day is the rough scale below which a coin
    # physically cannot absorb meaningful institutional-sized buying without
    # extreme slippage - under that, a "breakout on volume" reading is
    # indistinguishable from the ordinary day-to-day swings of a thin
    # market. Starting value, not calibrated against outcomes yet - subject
    # to the same future threshold calibration as everything else in this
    # file (see BACKLOG.md's backtest entry), not derived from how many
    # signals it happens to leave on the current history.
    min_volume_avg_usd: 1000000

schedule:
  # Revenue/fees is a "slow" signal per TZ section 5 - daily polling is enough.
  defillama_poll_hours: 24
  # Local time of day ("HH:MM", 24h) the Windows Task Scheduler task runs
  # main.py. Read by scripts/register_scheduled_task.ps1 - change the value
  # here and re-run that script to reschedule, instead of editing the .ps1.
  defillama_run_time: "11:00"
  # OI is a "fast" signal per TZ section 5 - poll every few hours, not daily.
  binance_futures_poll_hours: 6
  # Local time of day ("HH:MM", 24h) the repeating BinanceOI trigger is
  # anchored to - only its time-of-day matters (it fixes which clock hours
  # the repeating trigger lands on, e.g. anchoring at 03:00 with a 6h
  # interval fires at 03:00/09:00/15:00/21:00). Read by
  # scripts/register_scheduled_task.ps1 the same way as the other
  # *_run_time values below - change the value here and re-run that script
  # to reschedule, instead of editing the .ps1.
  binance_anchor_time: "03:00"
  # Local time of day ("HH:MM", 24h) the Windows Task Scheduler task runs
  # scripts/backup_db.py (the SQLite Online Backup API snapshot of
  # storage/db.sqlite - see that script's module docstring). Same format and
  # same scripts/register_scheduled_task.ps1 wiring as defillama_run_time
  # above - change the value here and re-run that script to reschedule.
  # Default is an hour after defillama_run_time (11:00), so the daily
  # DeFiLlama snapshot has already landed in storage/db.sqlite by the time
  # that day's backup is taken - not a hard dependency (the backup just
  # copies whatever is in the database at the time it runs, and the
  # BinanceOI task writes to it too), just a reasonable quiet-morning slot
  # that avoids overlapping the DeFiLlama task's own run.
  backup_run_time: "12:00"
  # Local time of day ("HH:MM", 24h) the Windows Task Scheduler task runs
  # notifications/telegram_bot.py (the daily Telegram digest of ranked
  # candidates - MVP.md checklist item 5). Same format and same
  # scripts/register_scheduled_task.ps1 wiring as the other *_run_time
  # values above. Set an hour after backup_run_time (12:00), so the daily
  # DeFiLlama+CoinGecko cycle (can take several minutes because of
  # CoinGecko's rate limits) and the backup have both had time to finish
  # before the digest queries storage/db.sqlite for that day's candidates.
  telegram_run_time: "12:30"

storage:
  sqlite_path: storage/db.sqlite

backup:
  # Folder scripts/backup_db.py writes timestamped backups into. Lives here,
  # not only as that script's --backup-dir flag, because the scheduled task
  # (CryptoSignalAgent-Backup, see scripts/register_scheduled_task.ps1) runs
  # backup_db.py with no arguments at all - if this path only existed as a
  # CLI flag, the scheduled task would silently keep writing to the old
  # location until someone remembered to edit the .ps1 and re-register it.
  # Points inside the local Google Drive sync folder (G:\My Drive), NOT the
  # drive's root, so backups land in their own subfolder rather than mixed in
  # among everything else already synced there - see backup_db.py's module
  # docstring for why a cloud-synced folder is worth pointing this at instead
  # of the project-local default.
  backup_dir: "G:\\My Drive\\crypto-signal-agent-backups"
